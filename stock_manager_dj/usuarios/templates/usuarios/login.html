{%load static%}
<html class="h-full bg-white">

<head>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>

<body class="h-full ">
{% if erro %}
    <p style="color:red;">{{ erro }}</p>
{% endif %}


<div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <img class="mx-auto h-10 w-auto" src="{% static 'images/stock_manager_icon.svg' %}" alt="Your Company">
      <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900">Entre na sua conta</h2>
    </div>
  
    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
      <form class="space-y-6" action="#" method="POST">
        {% csrf_token %}
        <div>
          <label for="email" class="block text-sm/6 font-medium text-gray-900">Usuário</label>
          <div class="mt-2">
            <input type="text" name="username" id="username" placeholder="Digite seu usuário" required class="border block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
          </div>
        </div>
  
        <div>
          <div class="flex items-center justify-between">
            <label for="password" class="block text-sm/6 font-medium text-gray-900">Senha</label>
          </div>
          <div class="mt-2">
            <input type="password" name="password" id="password" placeholder="Digite sua senha" required class="border block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6">
          </div>
        </div>
  
        <div>
          <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">Entrar</button>
        </div>
      </form>
  
      <p class="mt-10 text-center text-sm/6 text-gray-500">
        Não tem uma conta?
        <a href="{% url 'usuarios:registrar' %}" class="font-semibold text-indigo-600 hover:text-indigo-500">Registre-se</a>
      </p>
    </div>
  </div>
</body>
</html>
