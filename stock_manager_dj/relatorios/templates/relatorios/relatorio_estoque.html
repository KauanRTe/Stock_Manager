{% extends 'gerenciar_estoque_base.html' %}

{% block content %}
<h1>📊 Relatório de Estoque</h1>
<table border="1">
    <tr>
        <th>Produto</th>
        <th>Quantidade Atual</th>
    </tr>
    {% for produto in produtos %}
    <tr>
        <td>{{ produto.nome }}</td>
        <td>{{ produto.total_estoque|default:0 }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
